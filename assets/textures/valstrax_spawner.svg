<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Crimson Glow Valstrax Boss Spawner (16x16 block texture)</title>
  <!-- Block base (dark obsidian) -->
  <rect x="0" y="0" width="16" height="16" fill="#1a1224"/>
  <rect x="2" y="2" width="12" height="12" fill="#241a33" stroke="#120c1c" stroke-width="1"/>
  <!-- Metallic cage bars -->
  <rect x="3" y="1" width="1" height="15" fill="#56506e"/>
  <rect x="12" y="1" width="1" height="15" fill="#56506e"/>
  <rect x="1" y="3" width="14" height="1" fill="#56506e"/>
  <rect x="1" y="12" width="14" height="1" fill="#56506e"/>
  <!-- Rotating Valstrax head silhouette inside the cage -->
  <!-- horns -->
  <path d="M6 3 L5 1 L7 2 L8 1 L9 2 L11 1 L10 3 Z" fill="#8a8400"/>
  <!-- head -->
  <path d="M5 4 L11 4 L12 6 L11 8 L8 9 L5 8 L4 6 Z" fill="#9e1b1b"/>
  <!-- jaw -->
  <path d="M5 8 L8 9 L8 11 L6 10 L4 10 Z" fill="#5e0f0f"/>
  <!-- crimson eyes -->
  <rect x="6" y="5" width="1" height="1" fill="#ff2f2f"/>
  <rect x="9" y="5" width="1" height="1" fill="#ff2f2f"/>
  <!-- chest core glint -->
  <path d="M7 7 L9 7 L8 8 Z" fill="#ff6a3d"/>
  <!-- particle sparks -->
  <rect x="5" y="3" width="1" height="1" fill="#ffb36b" opacity="0.8"/>
  <rect x="10" y="6" width="1" height="1" fill="#ff6a3d" opacity="0.7"/>
  <rect x="3" y="8" width="1" height="1" fill="#ffb36b" opacity="0.6"/>
  <rect x="12" y="10" width="1" height="1" fill="#ff6a3d" opacity="0.7"/>
  <!-- glow at bottom corners -->
  <rect x="1" y="14" width="2" height="1" fill="#5e0f0f"/>
  <rect x="13" y="14" width="2" height="1" fill="#5e0f0f"/>
</svg>
